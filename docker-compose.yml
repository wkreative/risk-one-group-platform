version: "3.9"

services:
  db:
    image: postgres:16
    container_name: rog_db
    environment:
      POSTGRES_DB: risk_one_group
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - rog_data:/var/lib/postgresql/data

volumes:
  rog_data:
